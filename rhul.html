<template id="tpl-start">
    <p class="eyebrow">Egham, Surrey · Campus drive</p>
    <h1>Royal<span class="line2">Holloway</span></h1>
    <p class="lede">Drive anywhere on the Egham campus, built from the campus map: every building outline, road, footpath, tree and pond where the map shows it. Drive up to a building and its story appears here, or press <b>Auto tour</b>.</p>
    <p class="lede" style="font-size:13px;opacity:.85">An unofficial tribute by alumnus Alex Philip (MSc Information Security, 2022–2024). Not affiliated with or endorsed by Royal Holloway, University of London.</p>
  </template>
<template id="tpl-founders">
    <p class="eyebrow">Stop 1 · Founder's Building</p>
    <h2>A French château in Surrey</h2>
    <p>Designed by William Henry Crossland and inspired by the Château de Chambord in the Loire Valley, the red-brick Founder's Building was opened by Queen Victoria in 1886. It is Grade I listed.</p>
    <p>Thomas Holloway, a Victorian entrepreneur and philanthropist, founded the college here on the Mount Lee estate in 1879.</p>
    <p style="font-size:13px"><b style="color:#eb641e">Inside:</b> Student rooms, the dining hall, chapel, picture gallery and a lecture theatre</p>
    <p style="font-size:13px"><b style="color:#eb641e">Quads:</b> Queen Victoria's statue in the North Quad; Thomas and Jane Holloway in the South Quad</p>
  </template>
<template id="tpl-chapel">
    <p class="eyebrow">Stop 2 · Chapel &amp; Picture Gallery</p>
    <h2>Art and evensong</h2>
    <p>The Victorian chapel hosts Choral Evensong, Compline and Catholic Masses, and is known for daily sung morning services, which are rare at UK universities. The Chapel Choir gives around 50 concerts a year.</p>
    <p>Holloway bought 77 paintings for the Picture Gallery between 1881 and 1883, including works by Millais, Burne-Jones and Frith.</p>
    <p style="font-size:13px"><b style="color:#eb641e">Gallery:</b> Open to visitors on Wednesdays in term time</p>
  </template>
<template id="tpl-library">
    <p class="eyebrow">Stop 3 · Emily Wilding Davison Building</p>
    <h2>The library on Founder's Square</h2>
    <p>Opened in 2017 and named after alumna and suffragette Emily Wilding Davison, it holds the Library, the Student Services Centre, the Careers and Enterprise Hub and an exhibition space.</p>
    <p>Its roof terrace looks out over the campus towards London and Heathrow.</p>
    <p style="font-size:13px"><b style="color:#eb641e">Opened:</b> 18 October 2017, by The Princess Royal</p>
    <p style="font-size:13px"><b style="color:#eb641e">Outside:</b> Founder's Square, a paved courtyard for events</p>
  </template>
<template id="tpl-academic">
    <p class="eyebrow">Stop 4 · The academic quarter</p>
    <h2>Bedford, McCrea and Moore</h2>
    <p>The Bedford Building is home to the School of Engineering, Physical and Mathematical Sciences. The McCrea Building houses Law and Social Sciences, and the Moore Building the School of Business and Management.</p>
    <p>The name Bedford comes from Bedford College, founded in 1849 by Elizabeth Jesser Reid, which merged with Royal Holloway in 1985.</p>
    <p style="font-size:13px"><b style="color:#eb641e">Cyber:</b> The Information Security Group launched its MSc in Information Security in 1992, reportedly the first postgraduate course of its kind</p>
  </template>
<template id="tpl-north">
    <p class="eyebrow">Stop 5 · Boilerhouse &amp; George Eliot</p>
    <h2>Coffee in a Victorian boiler house</h2>
    <p>The Boilerhouse Café sits in a historic Victorian building with a cobbled courtyard, and gives its coffee grounds away for composting.</p>
    <p>George Eliot Halls, on the northern side of campus, are self-catered townhouses with shared kitchens and lounges.</p>
  </template>
<template id="tpl-union">
    <p class="eyebrow">Stop 6 · Students' Union &amp; Katharine Worth</p>
    <h2>Union Plaza</h2>
    <p>The Students' Union has a large function hall, two bars and Tommy's Kitchen. Union Plaza out front has a permanent canopy, benches and food vans, with a weekly street-food market.</p>
    <p>The student-run Insanity Radio broadcasts from campus on 103.2FM. Nearby, the Katharine Worth Building is home to the School of Performing and Digital Arts.</p>
  </template>
<template id="tpl-science">
    <p class="eyebrow">Stop 7 · Wolfson &amp; Beatrice Shilling</p>
    <h2>Labs with a wind turbine</h2>
    <p>The Wolfson Building houses the School of Life Sciences and the Environment.</p>
    <p>The Beatrice Shilling Building, opened in 2018–19, is home to Electronic Engineering. Its rooftop field laboratory has solar panels and a wind turbine. It is named after the engineer whose fix to British fighter engines mattered early in the Second World War.</p>
  </template>
<template id="tpl-hub">
    <p class="eyebrow">Stop 8 · The Hub</p>
    <h2>Food and hangouts</h2>
    <p>The Hub serves hot dishes, burgers, vegetarian and vegan meals and the Kimiko Japanese Kitchen. Downstairs, Imagine is a quieter spot for bubble tea or ice cream.</p>
  </template>
<template id="tpl-sports">
    <p class="eyebrow">Stop 9 · Sports Centre &amp; halls</p>
    <h2>Pitches under floodlights</h2>
    <p>The Sports Centre was refurbished in 2013 and its floodlit pitches opened for the 2014/15 season. The hockey club, the largest sports club on campus, plays on the hockey pitch, and the all-weather 3G pitch is FA-accredited for 11-a-side games.</p>
    <p>Gowar and Wedderburn halls, at the southern end of campus, opened in September 2004 with 570 en-suite rooms.</p>
  </template>
<template id="tpl-woodland">
    <p class="eyebrow">Stop 10 · Woodland Walk &amp; Meadow</p>
    <h2>A living campus</h2>
    <p>Much of the campus is woodland and green space managed for wildlife. The Woodland Walk passes a wooden bridge over a pond, and the Meadow, beyond Jane Holloway Hall, is part of the Bee Walk past a beehive.</p>
  </template>
<template id="tpl-about">
    <p class="eyebrow">End of the tour</p>
    <h2>Thanks for visiting.</h2>
    <p>Made with affection by Alex Philip, MSc Information Security 2022–2024. For official information about the university, visit <a href="https://www.royalholloway.ac.uk" target="_blank" rel="noopener">royalholloway.ac.uk</a>.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function () {
  'use strict';
  const isPhone = matchMedia('(max-width: 760px)').matches;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rand = mulberry32(11);
  const pick = arr => arr[Math.floor(rand() * arr.length)];

  // ---------- Renderer ----------
  const canvas = document.getElementById('scene');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) { document.body.classList.add('no-webgl'); return; }
  const MAX_PR = Math.min(devicePixelRatio || 1, 2);
  let curPR = Math.min(MAX_PR, isPhone ? 1.5 : 2);
  renderer.setPixelRatio(curPR);
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.shadowMap.enabled = !isPhone;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const FOG = new THREE.Color('#d6c2c8');
  scene.background = FOG;
  scene.fog = new THREE.Fog(FOG, 80, 440);
  const camera = new THREE.PerspectiveCamera(isPhone ? 62 : 48, innerWidth / innerHeight, 0.1, 1600);

  const matCache = {};
  const M = (c) => matCache[c] || (matCache[c] = new THREE.MeshPhongMaterial({ color: c, flatShading: true, shininess: 6, specular: 0x1a1a1a }));
  const BasicM = (c) => new THREE.MeshBasicMaterial({ color: c });
  const shadowy = (m, cast = true, recv = true) => { m.castShadow = cast; m.receiveShadow = recv; return m; };

  // ---------- Sky, sun, light ----------
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color('#3f4b7a') }, mid: { value: new THREE.Color('#b98fae') }, low: { value: FOG } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 vP; void main(){ float h = vP.y; vec3 c = mix(low, mid, smoothstep(0.0, 0.12, h)); c = mix(c, top, smoothstep(0.12, 0.6, h)); gl_FragColor = vec4(c, 1.0); }'
  }));
  sky.renderOrder = -10;
  scene.add(sky);

  const sunDir = new THREE.Vector3(0.35, 0.16, -1).normalize();
  const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(40, 48), new THREE.MeshBasicMaterial({ color: '#ffe6c2', fog: false }));
  const sunGlow = new THREE.Mesh(new THREE.CircleGeometry(110, 48), new THREE.MeshBasicMaterial({ color: '#f1bfae', fog: false, transparent: true, opacity: 0.3, depthWrite: false }));
  scene.add(sunGlow, sunDisc);

  scene.add(new THREE.HemisphereLight('#f3e9f0', '#6f6478', 0.86));
  const sunLight = new THREE.DirectionalLight('#ffdcb8', 0.78);
  sunLight.castShadow = !isPhone;
  sunLight.shadow.mapSize.set(isPhone ? 1024 : 4096, isPhone ? 1024 : 4096);
  sunLight.shadow.normalBias = 0.03;
  Object.assign(sunLight.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 400 });
  sunLight.shadow.bias = -0.0008;
  scene.add(sunLight, sunLight.target);

  // ---------- Ground ----------
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), M('#77a058'));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);
  const dummy = new THREE.Object3D();
  function instanced(geo, mat, list, colorFn) {
    const im = new THREE.InstancedMesh(geo, mat, Math.max(1, list.length));
    list.forEach((it, i) => {
      dummy.position.set(it.x, it.y || 0, it.z);
      dummy.rotation.set(it.rx || 0, it.ry || 0, it.rz || 0);
      dummy.scale.set(it.sx || 1, it.sy || 1, it.sz || 1);
      dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix);
      if (colorFn) im.setColorAt(i, colorFn(it));
    });
    im.count = list.length; im.castShadow = true; im.receiveShadow = true;
    scene.add(im); return im;
  }
  // ---------- London: landmarks ----------
  const spinners = [];
  const STONE = '#d8cdb4', PORTLAND = '#e7e0d1', SLATE = '#4d5866', GOLD = '#d4a83a', RED = '#c8102e', BLUE_STEEL = '#6d9ac4';
  function placeAt(u, side, off, along = 0) {
    const f = frameAt(u); const pos = f.p.clone().addScaledVector(f.n, side * off).addScaledVector(f.t, along);
    return { f, pos, heading: Math.atan2(f.t.x, f.t.z) };
  }
  const mk = (geo, color, x, y, z, parent, o = {}) => {
    const m = shadowy(new THREE.Mesh(geo, typeof color === 'string' ? M(color) : color));
    m.position.set(x, y, z); if (o.rx) m.rotation.x = o.rx; if (o.ry) m.rotation.y = o.ry; if (o.rz) m.rotation.z = o.rz;
    parent.add(m); return m;
  };
  const UP = new THREE.Vector3(0, 1, 0);
  // keep the big ground plane safely below the road and pavements so it can never show through them
  ground.position.y = -0.08; ground.material = ground.material.clone(); Object.assign(ground.material, { polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4 });
  const MAP_MARKS = []; // landmarks shown with an icon on the mini-map
  const markAt = (prog, side, off, icon, tag) => MAP_MARKS.push({ p: placeAt(uOf(prog), side, off).pos, icon, tag });
  const DETOURS = []; // drives that traffic can turn into and come back out of (the university tributes)
  function beam(a, b, thick, color, parent) { // a box stretched from point a to point b
    const d = b.clone().sub(a), len = d.length();
    const m = shadowy(new THREE.Mesh(new THREE.BoxGeometry(thick, len, thick), M(color)));
    m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(UP, d.normalize()); parent.add(m); return m;
  }
  function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }
  const unionTex = canvasTex(240, 120, (x, w, h) => {
    x.fillStyle = '#012169'; x.fillRect(0, 0, w, h);
    x.strokeStyle = '#ffffff'; x.lineWidth = 24; x.beginPath(); x.moveTo(0, 0); x.lineTo(w, h); x.moveTo(w, 0); x.lineTo(0, h); x.stroke();
    x.strokeStyle = '#c8102e'; x.lineWidth = 8; x.beginPath(); x.moveTo(0, 0); x.lineTo(w, h); x.moveTo(w, 0); x.lineTo(0, h); x.stroke();
    x.fillStyle = '#ffffff'; x.fillRect(w / 2 - 20, 0, 40, h); x.fillRect(0, h / 2 - 20, w, 40);
    x.fillStyle = '#c8102e'; x.fillRect(w / 2 - 12, 0, 24, h); x.fillRect(0, h / 2 - 12, w, 24);
  });
  const unionMat = new THREE.MeshBasicMaterial({ map: unionTex, side: THREE.DoubleSide });
  // one shared waving flag cloth; every flag mesh reuses it
  const flagGeo = new THREE.PlaneGeometry(1, 0.5, 8, 1); flagGeo.translate(0.5, 0, 0);
  const flagBase = flagGeo.attributes.position.array.slice();
  spinners.push((dt, now) => { const a = flagGeo.attributes.position; for (let i = 0; i < a.count; i++) { const xx = flagBase[i * 3]; a.array[i * 3 + 2] = Math.sin(xx * 6 - now * 0.005) * 0.06 * xx; } a.needsUpdate = true; });
  function flagOnPole(parent, x, y, z, size, poleH, ry = 0) {
    const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
    mk(new THREE.CylinderGeometry(0.04 * size, 0.05 * size, poleH, 6), '#e4e4e8', 0, poleH / 2, 0, g);
    const f = new THREE.Mesh(flagGeo, unionMat); f.scale.set(size * 1.8, size * 1.8, size * 1.8); f.position.set(0.05, poleH - size * 0.5, 0); g.add(f);
    return g;
  }

    const [gx, gy] = toGrid(x, z), ix = Math.round(gx), iy = Math.round(gy);

  }

  let adaptResolution = () => {};
  // ================= VOXEL EDITION: everything rebuilt from blocks =================
  (function voxelise() {
    function mergeBoxes(list) { // [w, h, d, x, y, z] boxes merged into one geometry
      const pos = [], nor = [], uv = [];
      list.forEach(([w, h, d, x, y, z]) => {
        const g = new THREE.BoxGeometry(Math.max(w, 0.02), Math.max(h, 0.02), Math.max(d, 0.02)).toNonIndexed(); g.translate(x, y, z);
        pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); uv.push(...g.attributes.uv.array); g.dispose();
      });
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.computeBoundingBox(); g.computeBoundingSphere(); return g;
    }
    const cache = new Map();
    function voxelGeo(geo) {
      if (cache.has(geo.uuid)) return cache.get(geo.uuid);
      const t = geo.type, pr = geo.parameters || {};
      let out = null;
      if (!geo.boundingBox) geo.computeBoundingBox();
      const bb = geo.boundingBox, sz = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
      const ball = () => { // stacked slabs that follow a round profile; domes (half spheres) only get the top half
        const dome = t === 'SphereGeometry' && (pr.thetaLength || Math.PI) < Math.PI * 0.75, n = Math.max(3, Math.min(7, Math.round(sz.y / (dome ? 0.7 : 1.0)))), L = [];
        for (let i = 0; i < n; i++) {
          const tt = dome ? (i + 0.5) / n : -1 + (2 * i + 1) / n, k = Math.max(0.22, Math.sqrt(1 - tt * tt));
          L.push([sz.x * k, sz.y / n, sz.z * k, c.x, dome ? bb.min.y + (i + 0.5) * sz.y / n : c.y + tt * sz.y / 2, c.z]);
        }
        return mergeBoxes(L);
      };
      const steps = (n, down) => { const L = []; for (let i = 0; i < n; i++) { const k = 1 - i / n, y = bb.min.y + sz.y * (i + 0.5) / n; L.push([sz.x * k, sz.y / n, sz.z * k, c.x, down ? bb.max.y - (y - bb.min.y) : y, c.z]); } return mergeBoxes(L); };
      if (/^(Sphere|Icosahedron|Dodecahedron|Octahedron)Geometry$/.test(t)) out = ball();
      else if (t === 'ConeGeometry') out = steps(sz.y > 2 ? 4 : 2, (pr.height || 1) < 0);
      else if (t === 'CylinderGeometry') {
        const rt = pr.radiusTop ?? 1, rb = pr.radiusBottom ?? 1;
        if (Math.min(rt, rb) < Math.max(rt, rb) * 0.45 && sz.y > 0.6) out = steps(3, rt > rb);
        else out = mergeBoxes([[sz.x, sz.y, sz.z, c.x, c.y, c.z]]);
      } else if (t === 'TorusGeometry') {
        const R = pr.radius, tube = pr.tube, n = Math.max(8, Math.min(160, Math.round(2 * Math.PI * R / (tube * 2.2))));
        const s = Math.max(tube * 2, 2 * Math.PI * R / n * 0.95), L = [];
        for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; L.push([s, s, tube * 2, Math.cos(a) * R, Math.sin(a) * R, 0]); }
        out = mergeBoxes(L);
      } else if (t === 'CircleGeometry') out = mergeBoxes([[sz.x, sz.y, 0.02, c.x, c.y, c.z]]);
      cache.set(geo.uuid, out); return out;
    }
    // pixel grain: every surface gets a block-pixel pattern fixed in world space
    const patched = new Set();
    function pixelGrain(m) {
      if (!m || patched.has(m) || !(m.isMeshPhongMaterial || m.isMeshLambertMaterial || m.isMeshStandardMaterial)) return;
      patched.add(m); m.flatShading = true;
      m.onBeforeCompile = sh => {
        sh.vertexShader = 'varying vec3 vVoxW;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n  vec4 vw = vec4(transformed, 1.0);\n  #ifdef USE_INSTANCING\n  vw = instanceMatrix * vw;\n  #endif\n  vVoxW = (modelMatrix * vw).xyz;');
        sh.fragmentShader = 'varying vec3 vVoxW;\n' + sh.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\n  vec3 vc = floor(vVoxW * 3.0 + 0.002);\n  float vh = fract(sin(dot(vc, vec3(12.9898, 78.233, 37.719))) * 43758.5453);\n  diffuseColor.rgb *= 0.84 + 0.2 * vh;');
      };
      m.needsUpdate = true;
    }
    // cars and buses keep their original smooth look
    const ownMat = new Map();
    const keep = [rider].concat((trafficRef.list || []).map(o => o.v));
    scene.traverse(o => { if (o.userData.keepSmooth) keep.push(o); });
    keep.forEach(root => root && root.traverse(o => {
      o.userData.noVox = true;
      if (o.isMesh && o.material && !Array.isArray(o.material)) { let c = ownMat.get(o.material); if (!c) { c = o.material.clone(); ownMat.set(o.material, c); } o.material = c; }
    }));
    scene.traverse(o => {
      if (!o.isMesh || o.userData.noVox) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m && m.map) { m.map.magFilter = THREE.NearestFilter; m.map.minFilter = THREE.NearestFilter; m.map.generateMipmaps = false; m.map.needsUpdate = true; } });
      mats.forEach(pixelGrain);
      if (mats.some(m => m && m.map) || !o.geometry) return; // keep signs, flags and badges readable
      const g2 = voxelGeo(o.geometry); if (g2) o.geometry = g2;
    });
    // chunky pixels: render at a lower resolution and scale up without smoothing
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2) * 0.5); renderer.setSize(innerWidth, innerHeight, false);
    renderer.domElement.style.width = '100vw'; renderer.domElement.style.height = '100vh';
    adaptResolution = () => {};
    addEventListener('resize', () => { renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2) * 0.5); });
  })();

  buildSolids();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    drive(dt); if (!reduceMotion) { moveTraffic(dt); moveWalkers(dt); spinners.forEach(s => s(dt, now)); }
    chase(dt); updateCard(); drawMap(); engineSound();
    speedEl.textContent = Math.round(Math.abs(car.speed) * 3.6 * 0.621) + ' mph';
    sunLight.position.set(rider.position.x + 60, 120, rider.position.z + 40); sunLight.target.position.copy(rider.position);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  requestAnimationFrame(frame);

  const copyBtn = () => document.getElementById('copyBtn');
  document.addEventListener('click', e => { if (e.target && e.target.id === 'copyBtn') { navigator.clipboard && navigator.clipboard.writeText('alex.philip99@hotmail.com'); e.target.textContent = 'Copied'; } });
})();
</script>
